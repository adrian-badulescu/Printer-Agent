# Build WiX Burn bootstrapper → URSPrinterAgentSetup.exe (WireGuard + agent MSI).
# Release asset: single .exe (no ZIP). FE: .../releases/download/vX.Y.Z/URSPrinterAgentSetup.exe
#
# Triggers: push main/master (artifact), tag v* (GitHub Release), workflow_dispatch.
# Runner: self-hosted Windows with .NET 10 SDK pre-installed (no setup-dotnet; runner user cannot write to Program Files).

name: Printer Agent build (self-hosted)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: printer-agent-self-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: [self-hosted, Windows]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Self-hosted: SDK must already be on the machine (install once as Admin).
      # setup-dotnet tries to write under C:\Program Files\dotnet and fails for the runner service account.
      - name: Verify .NET 10 SDK (pre-installed on runner)
        shell: powershell
        run: |
          $sdk = dotnet --list-sdks 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'dotnet CLI not on PATH. Install .NET 10 SDK on this self-hosted runner.' }
          if ($sdk -notmatch '10\.') { throw "No .NET 10 SDK found. Install from https://dotnet.microsoft.com/download. Installed SDKs:`n$sdk" }
          Write-Host 'dotnet SDK OK:'
          dotnet --list-sdks | Select-String '10\.'

      - name: Inject production config from GitHub Secrets
        shell: powershell
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_USER: ${{ secrets.REDIS_USER }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          UPDATE_SIGNATURE_SECRET: ${{ secrets.UPDATE_SIGNATURE_SECRET }}
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'PrinterAgent.Worker\agent.json'
          if (-not (Test-Path -LiteralPath $path)) { throw "Missing: $path" }
          $json = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if ($env:REDIS_PASSWORD) {
            $json.Redis.Password = $env:REDIS_PASSWORD
            Write-Host 'Redis.Password injected from REDIS_PASSWORD secret (legacy one-release fallback).'
          } else {
            $json.Redis.Password = ''
            if ($json.Redis.PSObject.Properties['User']) { $json.Redis.User = '' }
            Write-Host 'REDIS_PASSWORD not set — MSI ships without global Redis password; agents fetch per-restaurant ACL credentials after enroll.'
          }
          if ($env:REDIS_HOST) { $json.Redis.Host = $env:REDIS_HOST }
          if ($env:REDIS_USER) { $json.Redis.User = $env:REDIS_USER }
          if ($env:BACKEND_URL) { $json.BackendUrl = $env:BACKEND_URL }
          if ($env:UPDATE_SIGNATURE_SECRET) {
            $json.UpdateSignatureSecret = $env:UPDATE_SIGNATURE_SECRET
            Write-Host 'UpdateSignatureSecret injected from UPDATE_SIGNATURE_SECRET secret.'
          } else {
            Write-Host 'UPDATE_SIGNATURE_SECRET not set — auto-update manifest signature will be empty until secret is configured.'
          }
          $content = $json | ConvertTo-Json -Depth 20
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($path, $content, $utf8NoBom)

      - name: Verify Redis config for MSI
        shell: powershell
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'PrinterAgent.Worker\agent.json'
          $redis = (Get-Content -LiteralPath $path -Raw | ConvertFrom-Json).Redis
          if ([string]::IsNullOrWhiteSpace($redis.Host)) { throw 'Redis.Host is empty in agent.json after inject.' }
          if ([string]::IsNullOrWhiteSpace($redis.Password)) {
            Write-Host 'Redis.Password empty (expected for per-restaurant credential builds).'
          } else {
            Write-Host "Redis.Password present for legacy MSI build (length=$($redis.Password.Length) chars, value not logged)."
          }

      - name: Build installer (Burn)
        run: dotnet build PrinterAgent.Bundle/PrinterAgent.Bundle.wixproj -c Release -p:SelfSignedMsiSigning=true

      - name: Verify installer output
        shell: powershell
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'PrinterAgent.Bundle\bin\Release\URSPrinterAgentSetup.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Installer missing: $exe" }
          Copy-Item -LiteralPath $exe -Destination (Join-Path $env:GITHUB_WORKSPACE 'URSPrinterAgentSetup.exe') -Force
          Get-Item (Join-Path $env:GITHUB_WORKSPACE 'URSPrinterAgentSetup.exe') | Format-List FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: URSPrinterAgentSetup
          path: URSPrinterAgentSetup.exe
          retention-days: 3

      - name: Generate release manifest (tag v* only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          UPDATE_SIGNATURE_SECRET: ${{ secrets.UPDATE_SIGNATURE_SECRET }}
        run: |
          $tagVersion = $env:GITHUB_REF_NAME
          if ($tagVersion -match '^v(.+)$') { $tagVersion = $Matches[1] } else { throw "Unexpected tag name: $tagVersion" }
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\New-ReleaseManifest.ps1') `
            -InstallerPath (Join-Path $env:GITHUB_WORKSPACE 'URSPrinterAgentSetup.exe') `
            -Version $tagVersion `
            -OutputPath (Join-Path $env:GITHUB_WORKSPACE 'release-manifest.json') `
            -UpdateSignatureSecret $env:UPDATE_SIGNATURE_SECRET

      - name: Upload release asset (tag v* only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            URSPrinterAgentSetup.exe
            release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
